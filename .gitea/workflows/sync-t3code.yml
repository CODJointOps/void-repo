name: Sync T3 Code nightly

on:
  schedule:
    - cron: '20 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.ACCESS_GIT }}
      - name: Import nightly template
        run: |
          set -eu
          git clone --depth 1 https://git.deadzone.lol/Wizzard/t3code-nightly-void.git /tmp/t3code-nightly
          mkdir -p srcpkgs/t3code-nightly-bin
          cp /tmp/t3code-nightly/template srcpkgs/t3code-nightly-bin/template
          git add srcpkgs/t3code-nightly-bin/template
          if ! git diff --cached --quiet; then
            git config user.name 'gitea-actions[bot]'
            git config user.email 'gitea-actions[bot]@noreply.deadzone.lol'
            git commit -m 'sync: update T3 Code nightly'
            git pull --rebase origin master
            git push origin master
          fi
